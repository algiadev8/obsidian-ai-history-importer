name: CI

on:
    push:
        branches: ["main"]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Audit dependencies
              run: pnpm audit

            - name: Check formatting
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint

            - name: Test
              run: pnpm run test

            - name: Build
              run: pnpm run build

            - name: Typecheck plugin
              run: pnpm --filter plugin exec tsc --noEmit -p tsconfig.json

            - name: Check generated output does not break lint
              run: pnpm run lint
